# Demo content for `bin/console app:demo:install`.
# Campus Zentralschweiz is a fictional school. All names and addresses are made up.

# Photos in fixtures/images, all from Pexels under the Pexels license (https://www.pexels.com/license/).
# The command stores the photographer as the copyright metadata of the asset.
images:
    web-entwicklung: { photographer: Daniil Komov, source: "https://www.pexels.com/photo/modern-laptop-displaying-code-in-cozy-workspace-34803986/" }
    informatik: { photographer: Mikhail Nilov, source: "https://www.pexels.com/photo/men-working-on-a-computer-7988742/" }
    cyber-security: { photographer: Brett Sayles, source: "https://www.pexels.com/photo/close-up-photo-of-cables-plugged-into-the-server-2881233/" }
    elektrotechnik: { photographer: mickael ange konan, source: "https://www.pexels.com/photo/female-technician-working-on-electrical-control-panel-34526423/" }
    maschinenbau: { photographer: Daniel Smyth, source: "https://www.pexels.com/photo/close-up-shot-of-a-cnc-machine-8865187/" }
    betriebswirtschaft: { photographer: Yan Krukau, source: "https://www.pexels.com/photo/businesspeople-brainstorming-in-a-meeting-7693692/" }
    projektmanagement: { photographer: cottonbro studio, source: "https://www.pexels.com/photo/project-manager-planning-tasks-6804091/" }
    ux-design: { photographer: picjumbo.com, source: "https://www.pexels.com/photo/notebook-beside-the-iphone-on-table-196644/" }
    campus: { photographer: Kampus Production, source: "https://www.pexels.com/photo/multiracial-students-sitting-together-and-listening-to-classmate-5940846/" }

# One document tree per language. The pages of both trees are linked as translations.
# The start page is built from bricks. A link points to a page by its path, an image to a generated asset by its name.
pages:
    de:
        home:
            title: Campus Zentralschweiz | Weiterbildung in Luzern, Zug, Zürich und Bern
            description: Höhere Fachschule für Informatik, Technik, Wirtschaft und Gestaltung. Berufsbegleitend an vier Standorten.
            bricks:
                -   type: hero
                    editables:
                        title: { type: input, data: "Weiterbildung, die zu deinem Berufsalltag passt" }
                        lead: { type: textarea, data: "Höhere Fachschule für Informatik, Technik, Wirtschaft und Gestaltung. Berufsbegleitend an vier Standorten in der Deutschschweiz." }
                        cta: { type: link, data: { text: "Alle Kurse ansehen", path: /de/kurse, linktype: internal, internalType: document } }
                -   type: featured-courses
                    editables:
                        headline: { type: input, data: "Beliebte Weiterbildungen" }
                -   type: text-image
                    editables:
                        headline: { type: input, data: "Lernen, wo du arbeitest" }
                        text: { type: wysiwyg, data: "<p>Mit Standorten in Luzern, Zug, Zürich und Bern ist der nächste Campus nie weit. Der Unterricht findet abends und am Samstag statt, ein Teil davon online.</p><p>Unsere Dozierenden arbeiten selbst in der Praxis und bringen aktuelle Projekte in den Unterricht mit.</p>" }
                        imagePosition: { type: select, data: "right" }
                        image: { type: image, data: { asset: campus } }
                -   type: faq
                    editables:
                        headline: { type: input, data: "Häufige Fragen" }
                    blocks:
                        items:
                            -   question: { type: input, data: "Kann ich die Weiterbildung neben dem Beruf besuchen?" }
                                answer: { type: wysiwyg, data: "<p>Ja. Die meisten Lehrgänge sind berufsbegleitend: Unterricht an zwei Abenden pro Woche und an einzelnen Samstagen.</p>" }
                            -   question: { type: input, data: "Welche Voraussetzungen brauche ich?" }
                                answer: { type: wysiwyg, data: "<p>Eine abgeschlossene berufliche Grundbildung oder eine gleichwertige Ausbildung sowie Berufserfahrung im Fachgebiet.</p>" }
                            -   question: { type: input, data: "Beteiligt sich mein Arbeitgeber an den Kosten?" }
                                answer: { type: wysiwyg, data: "<p>Viele Arbeitgeber tun das. Wir stellen dir gerne eine Kursbestätigung für dein Gespräch mit dem Arbeitgeber aus.</p>" }
        courses:
            key: kurse
            navigation: Kurse
            title: Kurse | Campus Zentralschweiz
            description: Alle Weiterbildungen im Überblick, filterbar nach Kategorie und Standort.
            editables:
                headline: { type: input, data: "Unsere Weiterbildungen" }
                intro: { type: wysiwyg, data: "<p>Finde die Weiterbildung, die zu dir passt. Filtere nach Kategorie oder Standort.</p>" }
        registration:
            key: anmeldung
            navigation: Anmeldung
            title: Anmeldung | Campus Zentralschweiz
            description: Melde dich für eine Weiterbildung an. Wir melden uns innerhalb weniger Tage bei dir.
            editables:
                headline: { type: input, data: "Anmeldung" }
                intro: { type: wysiwyg, data: "<p>Wähle Kurs und Standort und hinterlasse deine Kontaktdaten. Die Anmeldung ist unverbindlich, wir melden uns innerhalb weniger Tage bei dir.</p>" }
    fr:
        home:
            title: Campus Zentralschweiz | Formation continue à Lucerne, Zoug, Zurich et Berne
            description: École supérieure d'informatique, de technique, d'économie et de design. En emploi, sur quatre sites.
            bricks:
                -   type: hero
                    editables:
                        title: { type: input, data: "Une formation continue qui s'adapte à ton quotidien professionnel" }
                        lead: { type: textarea, data: "École supérieure d'informatique, de technique, d'économie et de design. En emploi, sur quatre sites en Suisse alémanique." }
                        cta: { type: link, data: { text: "Voir tous les cours", path: /fr/cours, linktype: internal, internalType: document } }
                -   type: featured-courses
                    editables:
                        headline: { type: input, data: "Formations appréciées" }
                -   type: text-image
                    editables:
                        headline: { type: input, data: "Apprendre près de ton lieu de travail" }
                        text: { type: wysiwyg, data: "<p>Avec des sites à Lucerne, Zoug, Zurich et Berne, le prochain campus n'est jamais loin. Les cours ont lieu le soir et le samedi, une partie en ligne.</p><p>Nos enseignantes et enseignants travaillent eux-mêmes dans la pratique et apportent des projets actuels en classe.</p>" }
                        imagePosition: { type: select, data: "right" }
                        image: { type: image, data: { asset: campus } }
                -   type: faq
                    editables:
                        headline: { type: input, data: "Questions fréquentes" }
                    blocks:
                        items:
                            -   question: { type: input, data: "Puis-je suivre la formation en parallèle de mon emploi ?" }
                                answer: { type: wysiwyg, data: "<p>Oui. La plupart des filières sont en emploi : cours deux soirs par semaine et certains samedis.</p>" }
                            -   question: { type: input, data: "De quels prérequis ai-je besoin ?" }
                                answer: { type: wysiwyg, data: "<p>Une formation professionnelle initiale achevée ou une formation équivalente, ainsi qu'une expérience professionnelle dans le domaine.</p>" }
                            -   question: { type: input, data: "Mon employeur participe-t-il aux frais ?" }
                                answer: { type: wysiwyg, data: "<p>Beaucoup d'employeurs le font. Nous te fournissons volontiers une attestation de cours pour ton entretien avec ton employeur.</p>" }
        courses:
            key: cours
            navigation: Cours
            title: Cours | Campus Zentralschweiz
            description: Toutes les formations en un coup d'œil, filtrables par catégorie et par site.
            editables:
                headline: { type: input, data: "Nos formations" }
                intro: { type: wysiwyg, data: "<p>Trouve la formation qui te convient. Filtre par catégorie ou par site.</p>" }
        registration:
            key: inscription
            navigation: Inscription
            title: Inscription | Campus Zentralschweiz
            description: Inscris-toi à une formation. Nous te contactons dans les prochains jours.
            editables:
                headline: { type: input, data: "Inscription" }
                intro: { type: wysiwyg, data: "<p>Choisis le cours et le site et laisse tes coordonnées. L'inscription est sans engagement, nous te contactons dans les prochains jours.</p>" }

