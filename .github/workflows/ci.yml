name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    checks:
        name: Code style, tests and static analysis
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - uses: actions/checkout@v4

            # The containers write into the checkout, so they run as the user of the runner.
            - name: Use the runner user in the containers
              run: |
                  echo "DOCKER_UID=$(id -u)" >> "$GITHUB_ENV"
                  echo "DOCKER_GID=$(id -g)" >> "$GITHUB_ENV"

            - name: Start the database and the cache
              run: docker compose --profile test up -d --wait redis test-db

            - name: Install the Composer packages
              run: docker compose run --rm -T test-php composer install --no-interaction --no-progress

            - name: Code style
              run: docker compose run --rm -T test-php vendor/bin/php-cs-fixer fix --dry-run --diff

            - name: Tests
              run: make test

            - name: Static analysis
              run: make stan
